# bin/install.sh settings for pay.agent (OpenInstall: https://logicsrc.com/openinstall).
# No secrets here: settings go in $STATE_DIR/app.env, written from the logicsrc
# vault profullstack/pay-agent--prod (PAYAGENT_KEY, PAYAGENT_COINPAY_CLIENT_ID,
# PAYAGENT_COINPAY_CLIENT_SECRET, PAYAGENT_DB).
#
# DOMAINS is empty on purpose: pay.agent is a Moshpit name, so there is no Let's
# Encrypt certificate to get. Its nginx vhost proxies to PORT with the
# Moshpit-issued certificate that moshpit-renew.timer keeps fresh.
APP=pay-agent
RUNTIME=bun
INSTALL_CMD=bun install --production --frozen-lockfile
BUILD_CMD=none
START_CMD=bun src/server.ts
PORT=8796
HEALTH_PATH=/health
DOMAINS=
ACCESS_LOG=off
